server:
  port: ${PORT:${SERVER_PORT:8080}}
  # Limitar hilos de Tomcat para reducir consumo de RAM en Railway
  tomcat:
    threads:
      max: 20       # Por defecto son 200; con pocos usuarios concurrentes, 20 es suficiente
      min-spare: 4  # Hilos mínimos en espera (ahorra memoria en periodos de inactividad)
    connection-timeout: 20000

spring:
  config:
    import: optional:file:.env[.properties]

  # Carga lazy: los beans se inicializan solo cuando se usan por primera vez.
  # Reduce el uso de RAM al arrancar (~25-30% menos en startup).
  main:
    lazy-initialization: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lectoapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # Pool de conexiones reducido para Railway (por defecto HikariCP usa 10)
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000       # Cierra conexiones inactivas después de 5 min
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,https://lectoapp-frontend-angular-u7dd.vercel.app}

jwt:
  secret: ${JWT_SECRET:MagicMindDefaultProductionSecretKey2026TatianaPlatform!}
  expiration: ${JWT_EXPIRATION:86400000}

lectoapp:
  admin:
    nombre: ${ADMIN_NOMBRE:Administrador}
    apellido: ${ADMIN_APELLIDO:Sistema}
    correo: ${ADMIN_CORREO:admin@lectoapp.com}
    password: ${ADMIN_PASSWORD:admin123}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent