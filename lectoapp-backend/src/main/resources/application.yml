server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lectoapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203}

jwt:
  secret: ${JWT_SECRET:MagicMindDefaultProductionSecretKey2026TatianaPlatform!}
  expiration: ${JWT_EXPIRATION:86400000}

lectoapp:
  admin:
    nombre: ${ADMIN_NOMBRE:Administrador}
    apellido: ${ADMIN_APELLIDO:Sistema}
    correo: ${ADMIN_CORREO:admin@lectoapp.com}
    password: ${ADMIN_PASSWORD:admin123}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent