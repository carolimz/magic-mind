<article
  class="flex h-full flex-1 flex-col rounded-[2.5rem] border-4 border-white bg-white/90 p-7 text-center shadow-xl sm:p-10"
>
  <p
    class="text-sm font-black uppercase tracking-[0.2em] text-orange-500"
  >
    ¡Simón Dice!
  </p>

  <div class="mt-8 flex flex-col items-center justify-center gap-6">
    <button
      type="button"
      class="flex h-32 w-32 items-center justify-center rounded-full bg-orange-100 text-6xl shadow-inner transition-transform active:scale-95 sm:h-40 sm:w-40 sm:text-7xl"
      (click)="listenInstruction()"
      aria-label="Escuchar instrucción"
    >
      🎧
    </button>
    <p class="text-xl font-bold text-slate-600 sm:text-2xl">
      @if (showHint()) {
        {{ item().pregunta }}
      } @else {
        ¡Toca los audífonos para escuchar a Simón!
      }
    </p>
  </div>

  @if (item().recurso) {
    <div
      class="mx-auto mt-6 flex min-h-24 w-full max-w-sm items-center justify-center rounded-3xl bg-sky-50 p-5 text-4xl"
    >
      {{ item().recurso }}
    </div>
  }

  <div
    class="mx-auto mt-8 grid w-full max-w-2xl gap-4 sm:grid-cols-2"
  >
    @for (
      option of item().opciones;
      track option
    ) {
      <button
        type="button"
        class="answer-option min-h-20 rounded-3xl border-4 px-5 py-4 text-xl font-black transition-all"
        [class.answer-option--selected]="selectedAnswer() === option"
        [class.answer-option--idle]="selectedAnswer() !== option"
        [disabled]="submitting()"
        (click)="selectAnswer(option)"
      >
        {{ option }}
      </button>
    }
  </div>

  <div class="mt-auto pt-8">
    <p-button
      [label]="
        lastItem()
          ? 'Terminar'
          : 'Siguiente'
      "
      [icon]="
        lastItem()
          ? 'pi pi-check'
          : 'pi pi-arrow-right'
      "
      iconPos="right"
      size="large"
      [loading]="submitting()"
      [disabled]="!selectedAnswer() || submitting()"
      (onClick)="continue()"
    />
  </div>
</article>
