<article
  class="syllable-game flex h-full flex-1 flex-col rounded-[2.5rem] border-4 border-white p-6 text-center shadow-xl sm:p-9"
>
  <div>
    <p
      class="text-5xl"
      aria-hidden="true"
    >
      🎵
    </p>

    <p
      class="mt-2 text-lg font-black text-purple-700"
    >
      Escucha y forma la sílaba
    </p>

    <button
      type="button"
      class="sound-button"
      aria-label="Escuchar la sílaba"
      (click)="speakInstruction()"
    >
      <i
        class="pi pi-volume-up"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  <div
    class="mt-7"
    aria-label="Lugar para formar la sílaba"
  >
    <div
      id="answer-zone"
      cdkDropList
      cdkDropListOrientation="horizontal"
      [cdkDropListData]="assembledLetters()"
      [cdkDropListConnectedTo]="['letter-bank']"
      class="answer-zone"
      (cdkDropListDropped)="dropLetter($event)"
    >
      @for (
        letter of assembledLetters();
        track $index
      ) {
        <button
          type="button"
          cdkDrag
          class="letter-tile letter-tile--placed"
          [attr.aria-label]="
            'Letra colocada ' + letter
          "
          (cdkDragStarted)="startDragging()"
          (cdkDragEnded)="finishDragging()"
          (click)="removeLetter($index)"
        >
          {{ letter }}
        </button>
      }

      @for (
        emptySlot of emptySlots();
        track emptySlot
      ) {
        <div
          class="answer-slot"
          aria-hidden="true"
        >
          ?
        </div>
      }
    </div>

    <p class="mt-3 font-bold text-slate-500">
      Arrastra o toca las letras
    </p>
  </div>

  <div class="mt-8">
    <div
      id="letter-bank"
      cdkDropList
      cdkDropListOrientation="horizontal"
      [cdkDropListData]="availableLetters()"
      [cdkDropListConnectedTo]="['answer-zone']"
      class="letter-bank"
      aria-label="Letras disponibles"
      (cdkDropListDropped)="dropLetter($event)"
    >
      @for (
        letter of availableLetters();
        track $index
      ) {
        <button
          type="button"
          cdkDrag
          class="letter-tile"
          [attr.aria-label]="
            'Agregar letra ' + letter
          "
          (cdkDragStarted)="startDragging()"
          (cdkDragEnded)="finishDragging()"
          (click)="addLetter($index)"
        >
          {{ letter }}
        </button>
      }

      @if (availableLetters().length === 0) {
        <div
          class="flex items-center gap-2 font-bold text-emerald-700"
        >
          <span aria-hidden="true">✨</span>
          ¡Muy bien!
        </div>
      }
    </div>
  </div>

  <div
    class="mt-auto flex flex-col items-center justify-center gap-3 pt-8 sm:flex-row"
  >
    <p-button
      label="Empezar de nuevo"
      icon="pi pi-refresh"
      severity="secondary"
      [disabled]="submitting()"
      (onClick)="resetLetters()"
    />

    <p-button
      [label]="
        lastItem()
          ? 'Terminar'
          : '¡Listo!'
      "
      [icon]="
        lastItem()
          ? 'pi pi-check'
          : 'pi pi-arrow-right'
      "
      iconPos="right"
      size="large"
      [loading]="submitting()"
      [disabled]="
        !canConfirm() ||
        submitting()
      "
      (onClick)="confirm()"
    />
  </div>
</article>
