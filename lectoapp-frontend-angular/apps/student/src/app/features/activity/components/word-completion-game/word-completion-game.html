<article
  class="word-game flex h-full flex-1 flex-col rounded-[2.5rem] border-4 border-white p-6 text-center shadow-xl sm:p-10"
>
  <div>
    <p class="text-lg font-black text-purple-700">
      {{ activityInstruction() }}
    </p>

    <div
      class="word-picture"
      aria-hidden="true"
    >
      {{ resourceEmoji() }}
    </div>

    <button
      type="button"
      class="sound-button"
      aria-label="Escuchar la palabra"
      (click)="speakInstruction()"
    >
      <i
        class="pi pi-volume-up"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  <div
    class="word-board"
    aria-label="Palabra que debes completar"
  >
    @for (
      part of wordParts();
      track $index
    ) {
      @if (part === '_') {
        <div
          class="word-letter word-letter--missing"
          [class.word-letter--completed]="
            selectedAnswer() !== null
          "
          [class.word-letter--syllable]="
            isSyllableActivity()
          "
        >
          {{ selectedAnswer() ?? '?' }}
        </div>
      } @else {
        <div class="word-letter">
          {{ part }}
        </div>
      }
    }
  </div>

  <div
    class="option-board"
    aria-label="Opciones disponibles"
  >
    @for (
      option of item().opciones;
      track option
    ) {
      <button
        type="button"
        class="letter-option"
        [class.letter-option--syllable]="
          option.length > 1
        "
        [class.letter-option--selected]="
          selectedAnswer() === option
        "
        [disabled]="submitting()"
        [attr.aria-label]="
          'Elegir ' + option
        "
        (click)="selectOption(option)"
      >
        {{ option }}
      </button>
    }
  </div>

  <div class="mt-auto pt-8">
    <p-button
      [label]="
        lastItem()
          ? 'Terminar'
          : '¡Listo!'
      "
      [icon]="
        lastItem()
          ? 'pi pi-check'
          : 'pi pi-arrow-right'
      "
      iconPos="right"
      size="large"
      [loading]="submitting()"
      [disabled]="
        !selectedAnswer() ||
        submitting()
      "
      (onClick)="continue()"
    />
  </div>
</article>
